# Builds the Windows installer (NSIS), signs it with Authenticode (SHA-256)
# and uploads the SIGNED exe to the GitHub Release.
#
# Runs when a release is published. It can also be started by hand
# (Actions > Release signed installer > Run workflow) for an existing tag.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CODE_SIGNING_CERTIFICATE_BASE64   the .pfx file, base64-encoded
#   CODE_SIGNING_CERTIFICATE_PASSWORD the .pfx password
#
# Encode the certificate (PowerShell), then paste the clipboard into the secret:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("codesign.pfx")) | Set-Clipboard
#
# The certificate is decoded only into the runner's temp folder and is deleted
# at the end of the job. It is never written to the repository.

name: Release signed installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, sign and re-upload (for example installer-v1.0)"
        required: true
        type: string

permissions:
  contents: write   # upload the asset to the release

concurrency:
  group: signed-installer-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-sign-upload:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      EXE_NAME: DarkSoulsItemRandomizer-Setup.exe
      PRODUCT_NAME: Dark Souls Item Randomizer Installer
      PRODUCT_URL: ${{ github.server_url }}/${{ github.repository }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check signing secrets
        env:
          CERT_B64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_B64 -or -not $env:CERT_PASSWORD) {
            throw "Missing secret CODE_SIGNING_CERTIFICATE_BASE64 and/or CODE_SIGNING_CERTIFICATE_PASSWORD. Nothing was built or uploaded."
          }

      - name: Check that the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release '$env:TAG' not found." }

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed." }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "makensis.exe not found at $makensis" }
          & $makensis /VERSION

      - name: Build installer
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          Push-Location installer
          & $makensis /V2 DarkSoulsItemRandomizer-Setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (exit code $LASTEXITCODE)." }
          Pop-Location
          if (-not (Test-Path "installer/$env:EXE_NAME")) { throw "installer/$env:EXE_NAME was not produced." }

      - name: Sign installer (Authenticode, SHA-256)
        env:
          CERT_B64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\bin\\10\.\d+\.\d+\.\d+\\x64\\signtool\.exe$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe (Windows SDK, x64) not found on the runner." }
          Write-Host "Using $signtool"

          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))

          $outDir = Join-Path $env:RUNNER_TEMP 'signed'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $signed = Join-Path $outDir $env:EXE_NAME

          # RFC 3161 timestamp servers, tried in order
          $timestampServers = @(
            'http://timestamp.digicert.com',
            'http://timestamp.sectigo.com',
            'http://timestamp.globalsign.com/tsa/advanced'
          )
          $done = $false
          foreach ($ts in $timestampServers) {
            # Always sign a fresh copy so a failed attempt never leaves a half-signed file
            Copy-Item "installer/$env:EXE_NAME" $signed -Force
            Write-Host "Signing with timestamp server $ts"
            & $signtool sign /fd sha256 /f $pfx /p $env:CERT_PASSWORD /tr $ts /td sha256 /d $env:PRODUCT_NAME /du $env:PRODUCT_URL $signed
            if ($LASTEXITCODE -eq 0) { $done = $true; break }
            Write-Warning "Signing failed with $ts (exit code $LASTEXITCODE)."
          }
          if (-not $done) { throw "Signing failed with every timestamp server." }

      - name: Verify signature
        run: |
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\bin\\10\.\d+\.\d+\.\d+\\x64\\signtool\.exe$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $signed = Join-Path $env:RUNNER_TEMP "signed\$env:EXE_NAME"

          & $signtool verify /pa /all /v $signed
          if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa /all failed (exit code $LASTEXITCODE)." }

          $sig = Get-AuthenticodeSignature $signed
          if ($sig.Status -ne 'Valid') { throw "Authenticode status is '$($sig.Status)', expected 'Valid'." }
          if (-not $sig.TimeStamperCertificate) { throw "The signature has no timestamp." }

          $hash = (Get-FileHash $signed -Algorithm SHA256).Hash.ToLower()
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "SHA256: $hash"
          @(
            "### Signed installer",
            "",
            "- File: ``$env:EXE_NAME``",
            "- Release: ``$env:TAG``",
            "- Signer: ``$($sig.SignerCertificate.Subject)``",
            "- SHA256: ``$hash``"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload signed installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $signed = Join-Path $env:RUNNER_TEMP "signed\$env:EXE_NAME"
          gh release upload $env:TAG $signed --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed (exit code $LASTEXITCODE)." }

      - name: Remove certificate from the runner
        if: always()
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'codesign.pfx') -Force -ErrorAction SilentlyContinue
